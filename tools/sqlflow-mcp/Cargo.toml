[package]
name = "sqlflow-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server for SQLFlow: embedded reference docs plus a live control-plane proxy for catalog, lineage, runs, and schedules"

# The server is a library a host composes with modules of its own (src/host.rs, src/module.rs);
# sqlflow-mcp is that library run with none.
[lib]
name = "sqlflow_mcp"
path = "src/lib.rs"

[[bin]]
name = "sqlflow-mcp"
path = "src/main.rs"

[dependencies]
sqlflow-lang = { path = "../sqlflow-lang" }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
tokio = { workspace = true, features = ["net", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
# Lays out the SQL a tool's answer carries (src/sql_format.rs); whitespace only, every token checked.
sqlformat = "0.5.0"
# HTTP serving mode (`sqlflow-mcp http`): hyper hosts rmcp's streamable HTTP service.
# These stay in lockstep with the hyper stack reqwest already pulls in.
http = "1.5.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
