[workspace]
resolver = "2"
members = [
    "sqlflow-lang",
    "sqlflow-lang-wasm",
    "sqlflow-lsp",
    "sqlflow-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["SQLFlow"]
repository = "https://github.com/TahirRiaz/SQLFlow"

# Language intelligence and MCP tooling for SQLFlow `.flow.yaml`.
# These crates are the Rust half of the SQLFlow developer tooling; the
# VSCode extension (tools/sqlflow-vscode) is the TypeScript half and ships
# the two release binaries these crates produce.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
