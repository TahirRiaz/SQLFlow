# The SPA server block: hashed assets cache forever, the entry points never cache (so a deploy is picked up on
# the next load), and every unknown path falls back to the SPA router. The API is NOT proxied here; in the
# recommended layout the ingress routes /api/* to the control plane and everything else to this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames under /assets: safe to cache immutably.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The runtime configuration and the document itself must always be revalidated.
    location = /config.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
