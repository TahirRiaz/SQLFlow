# Consolidates several Citybike Azure Automation runbooks into ONE api flow. Each legacy runbook
# (citybikes-bikes.ps1, citybike_Inventory.ps1, citybike_issue_categories.ps1, citybike_alerts.ps1, ...) hit the
# same host under the same token; here they are one flow with a shared connection envelope under `source` and one
# `items:` entry per endpoint. Each item lands to its own raw path, so the matching downstream file/pre flow binds
# to it and lineage stays intact (one acquisition pipeline -> several downstream loads).
flowType: api
name: citybike_00_api
batch: Citybike

# Shared envelope: transport, base URL, auth (the pre-formed urlencoded token body held whole in Key Vault), and
# the reliability budget. Resolved once per run and applied to every item below.
source:
  transport: http
  baseUrl: https://api.kolumbus.citybike.cloud
  auth:
    type: token_exchange
    token:
      url: https://api.kolumbus.citybike.cloud/api/token
      bodyKind: form
      rawBody: ${keyvault:sqlflow-v3-secrets/citybike-token}
      headers:
        Content-Type: application/x-www-form-urlencoded
      tokenPath: access_token
      applyPrefix: "Bearer "
  reliability:
    rateLimitRps: 8
    urlAllowlist: ["*.citybike.cloud"]

items:
  # Simple full-snapshot GETs: one file per run.
  - name: bikes
    request:
      method: GET
      path: /api/Bikes
      headers: { Accept: application/json }
    landing:
      target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/citybike/api/bikes
      pathTemplate: "history/{yyyy}/{MM}/citybike_bikes_{yyyyMMdd}"
      format: json

  - name: inventory
    request:
      method: GET
      path: /api/Inventory
      headers: { Accept: application/json }
    landing:
      target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/citybike/api/inventory
      pathTemplate: "history/{yyyy}/citybike_inventory_{yyyyMMdd}"
      format: json

  - name: issue_categories
    request:
      method: GET
      path: /api/issue/categories
      headers: { Accept: application/json }
    landing:
      target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/citybike/api/issue_categories
      pathTemplate: "history/{yyyy}/citybike_issue_categories_{yyyyMMdd}"
      format: json

  # Per-item fan-out: discover bike ids, then fetch alerts per bike over a 3-day window. The item carries its own
  # iterate; the shared token still applies.
  - name: alert
    request:
      method: GET
      path: /api/alert/{bikeId}
      headers: { Accept: application/json }
      query:
        from: "{window.from:yyyy-MM-ddTHH:mm:ss.fffZ}"
        to: "{window.to:yyyy-MM-ddTHH:mm:ss.fffZ}"
    iterate:
      - kind: date_window
        granularity: day
        from: now-3d
        to: now
      - kind: ids_from
        variable: bikeId
        idRequest:
          method: GET
          path: /api/Bikes
          headers: { Accept: application/json }
        idPath: $[*].BikeId
    landing:
      target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/citybike/api/alert
      pathTemplate: "history/{window.from:yyyy}/citybike_alerts_{window.from:yyyyMMdd}_bike{bikeId}"
      format: json
