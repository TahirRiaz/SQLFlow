# Ports the vehicle-registry runbook: OAuth2 client-credentials with OIDC discovery (the token endpoint is resolved from
# the .well-known document), plus page-number pagination.
flowType: api
name: Fleetreg_Vehicles
batch: fleetreg

source:
  transport: http
  baseUrl: https://tenant.fleetreg.example
  auth:
    type: oauth2_client_credentials
    token:
      discoveryUrl: https://login.fleetreg.example/realms/tenant/.well-known/openid-configuration
      bodyKind: form
      body:
        grant_type: client_credentials
        client_id: tenant-internal-dwh-1
        client_secret: ${keyvault:dw-keyvault-prod/fleetreg-client-secret}
        scope: fleetregApi
      tokenPath: access_token
  request:
    method: GET
    path: /api/vehicle/vehicles
    query:
      pageSize: "100"
  pagination:
    strategy: page
    pageParam: page
    startPage: 1
    recordsPath: $.Items
    maxPages: 200
  reliability:
    rateLimitRps: 10
    urlAllowlist: ["*.fleetreg.example"]

landing:
  target: abfss://datalakev2@dwdatalakeprod.dfs.core.windows.net/raw/contoso/fleetreg
  pathTemplate: "history/{yyyy}/vehicles_{yyyyMMdd}_{page}"
  format: json
