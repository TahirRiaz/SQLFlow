# Strip control characters: remove non-printable control characters from values (useful
# for dirty exports). The sample data file for this example is generated by the test
# harness because control characters cannot be shown in a readable text file.
name: Csv_StripControl
source:
  type: csv
  location: ./data/control-chars.csv
  options:
    stripControlChars: "true"
target:
  connection: ${env:SQLFlowSinkConStr}
  schema: dbo
  table: Csv_StripControl
