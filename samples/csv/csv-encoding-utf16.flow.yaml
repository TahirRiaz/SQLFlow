# Encoding: read a file that is not UTF-8. srcEncoding accepts ASCII, UTF8, Unicode
# (UTF-16), UTF32. The sample data file for this example is generated by the test harness
# as UTF-16 so the bytes are correct.
#
# Note: to PRESERVE non-Latin Unicode (e.g. Cyrillic) end to end, the target columns must be
# nvarchar, not the default varchar(255). Reading the encoding is separate from storing it, so
# this example also sets an nvarchar default column type.
name: Csv_Utf16
source:
  type: csv
  location: ./data/encoding-utf16.csv
  options:
    srcEncoding: Unicode
target:
  connection: ${env:SQLFlowSinkConStr}
  schema: dbo
  table: Csv_Utf16
schema:
  evolve: widen
  defaultColumnType: nvarchar(400)
