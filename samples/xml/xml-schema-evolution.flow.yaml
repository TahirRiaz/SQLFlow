# Schema evolution: one process over two versions of the same dataset in a folder.
#   v1 <person> has { id, name };  v2 <person> has { id, fullName, email }.
# - The additive union gives the table every column (id, person_name, email); the older shape null-fills
#   the newer fields.
# - pathAliases reconciles the RENAMED element: /name (v1) and /fullName (v2) both feed one person_name
#   column, so a missing version-specific path is never left null.
name: Xml_SchemaEvolution
source:
  type: xml
  location: ./data/evolution
  options:
    srcFile: "*.xml"
    pathAliases: "person_name=/name|/fullName"
target:
  connection: ${env:SQLFlowSinkConStr}
  schema: dbo
  table: Xml_SchemaEvolution
schema:
  defaultColumnType: nvarchar(4000)
load:
  mode: truncate-load
