# Ports the settlement SFTP runbook as its own flow type: downloads the vendor's settlement files from an
# SFTP server into the data lake, verbatim, keeping only files modified in the last 3 days. The
# downstream xml file-flow parses what it lands. The password is a Key Vault reference, never inline.
flowType: sftp
name: Cyclehire_Settlement
batch: cyclehire
direction: download
server:
  host: sftp.example.com
  port: 22
  username: cyclehire-sftp
  passwordRef: ${keyvault:dw-keyvault-prod/cyclehire-sftp-settlement-password}
remotePath: /outbound
local: abfss://datalakev2@dwdatalakeprod.dfs.core.windows.net/raw/cyclehire/sftp/settlement
pattern: "*.xml"
recursive: true
modifiedWithinDays: 3
overwrite: true
preserveStructure: true

schedule:
  cron: "0 6 * * *"
