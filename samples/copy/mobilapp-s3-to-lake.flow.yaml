# Ports the mobilapp.ps1 AWS S3 pattern as a copy: one flow lists four dataset prefixes in the shared Kolumbus
# elasticsearch-export bucket (objects modified in the last 10 days) and copies each into its own lake folder,
# byte-for-byte. S3 has no ambient identity, so the access-key/secret-key pair is a secret reference on each source;
# the lake target uses the ambient managed identity. The keys select flat objects by literal prefix, so each object
# lands flat by its own name (preserveStructure: false).
flowType: cpy
name: Mobilapp_S3_00_cpy
batch: mobilapp
operation: copy
options:
  overwrite: true
  preserveStructure: false
items:
  - source:
      location: s3://elasticsearch-export-kolumbus/export_orders
      pattern: "*"
      modifiedWithinDays: 10
      accessKeyRef: ${keyvault:sqlflow-v3-secrets/aws-kolumbus-export-access-key}
      secretKeyRef: ${keyvault:sqlflow-v3-secrets/aws-kolumbus-export-secret-key}
      region: eu-west-1
    target:
      location: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/mobilapp/history/orders
  - source:
      location: s3://elasticsearch-export-kolumbus/export_payments
      pattern: "*"
      modifiedWithinDays: 10
      accessKeyRef: ${keyvault:sqlflow-v3-secrets/aws-kolumbus-export-access-key}
      secretKeyRef: ${keyvault:sqlflow-v3-secrets/aws-kolumbus-export-secret-key}
      region: eu-west-1
    target:
      location: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/mobilapp/history/payments

schedule:
  cron: "0 5 * * *"
